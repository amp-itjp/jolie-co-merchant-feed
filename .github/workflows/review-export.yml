name: Review export (one-off)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python3 -I tools/review_export.py jolie-je.myshopify.com reviews.csv
      - uses: actions/upload-artifact@v4
        with:
          name: reviews
          path: reviews.csv
          retention-days: 1

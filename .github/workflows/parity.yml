name: Parity check (Shopify export vs EPF)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export from Shopify
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python3 -I tools/shopify_export.py jolie-je.myshopify.com shopify.csv
      - name: Download the EPF CSV
        run: curl -sfL --max-time 180 -o epf.csv "https://epf.essentialshopifyapps.com/feeds/GoogleMerchantsupplementalfeed-431.csv"
      - name: Compare
        run: python3 -I tools/compare_feeds.py epf.csv shopify.csv
      - name: Build the supplemental file from the Shopify export (not published)
        run: python3 -I tools/build_variant_option_feed.py shopify.csv built.csv

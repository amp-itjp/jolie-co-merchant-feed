name: Refresh supplemental feed

on:
  schedule:
    # 04:15 UTC is 30 min before the winter fetch (05:00 UTC); 03:15 UTC is 30 min before the summer fetch (04:00 UTC).
    - cron: "15 3 * * *"
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both scripts exit non-zero on a failed export or a suspiciously small file, so a bad run
      # never reaches the deploy step and the previous file stays live.
      - name: Export from Shopify
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python3 -I tools/shopify_export.py jolie-je.myshopify.com shopify.csv
      - name: Build file
        run: |
          mkdir -p site
          python3 -I tools/build_variant_option_feed.py shopify.csv site/GOOGLE_SUPPLEMENTAL_ALL.csv
          cp static/product_reviews.xml site/product_reviews.xml
      # Per-country primary feeds. Pilot: only the US file is published until more countries are registered.
      - name: Export per-country catalog
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python3 -I tools/shopify_primary_export.py jolie-je.myshopify.com catalog.csv
      - name: Build US primary feed
        run: |
          mkdir -p primary
          python3 -I tools/build_primary_feed.py catalog.csv primary
          test "$(wc -l < primary/GOOGLE_PRIMARY_US.tsv)" -gt 15000
          cp primary/GOOGLE_PRIMARY_US.tsv site/GOOGLE_PRIMARY_US.tsv
          python3 -I tools/rekey_supplemental.py US site/GOOGLE_SUPPLEMENTAL_ALL.csv primary/GOOGLE_PRIMARY_US.tsv site/GOOGLE_SUPPLEMENTAL_US.csv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
